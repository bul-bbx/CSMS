<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f6f6;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 6px;
        }

        .header {
            font-size: 18px;
            font-weight: bold;
        }

        .event {
            margin-top: 15px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">📅 Event Reminder</div>

        <div class="event">
            <p>Hello {{UserName}},</p>

            <p>This is a reminder for your upcoming event:</p>

            <p>
                <strong>{{EventTitle}}</strong><br />
                ⏰ {{EventDate}}<br />
                📍 {{Location}}
            </p>

            <p>Please be on time.</p>
        </div>

        <div class="footer">
            © {{Year}} YourApp
        </div>
    </div>
</body>
</html>
